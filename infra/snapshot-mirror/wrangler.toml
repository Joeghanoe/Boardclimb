# Snapshot mirror (ADR-0006). A human creates the bucket, attaches the custom domain and deploys:
#   bunx wrangler@4 r2 bucket create boardclimb-snapshots
#   bunx wrangler@4 deploy
name = "boardclimb-snapshot-mirror"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[triggers]
# 45 minutes after BoardSesh's 07:15 UTC export, with one retry in the afternoon.
crons = ["0 8 * * *", "0 14 * * *"]

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "boardclimb-snapshots"

[vars]
# The bucket's public custom domain, a bare https origin. Set before the first deploy.
PUBLIC_BASE_URL = ""

[limits]
# Copying the 84 MB Kilter artifact needs more CPU than the free plan's 10 ms (Workers Paid).
cpu_ms = 300000
