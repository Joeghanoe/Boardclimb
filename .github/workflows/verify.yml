name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # bun lint ships only in canary builds so far (ADR-0004 section 7); setup-bun cannot pin one build.
          bun-version: canary
      - run: bun --revision
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run --cwd apps/mobile export:web
      - name: Export iOS JavaScript (no signing)
        working-directory: apps/mobile
        run: node ../../node_modules/expo/bin/cli export --platform ios --output-dir ../../artifacts/ios-export

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # bun lint ships only in canary builds so far (ADR-0004 section 7); setup-bun cannot pin one build.
          bun-version: canary
      - run: bun --revision
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: bun install --frozen-lockfile
      - name: Generate Android project
        working-directory: apps/mobile
        run: node ../../node_modules/expo/bin/cli prebuild --platform android --no-install
      - name: Compile native development app
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=x86_64,arm64-v8a
